# XcodeGen spec — run `xcodegen generate` (tools/build.sh does it), then open AMSExpenses.xcodeproj.
# iPhone only, portrait — laid out like AMS Packing: App/ (Sources, Resources, Config),
# Core/ (the parser, a Swift package with its own tests), UITests/.
name: AMSExpenses
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # The parser — everything the app knows about reading a sentence, with no screen in it.
  ExpenseCore:
    path: Core
targets:
  AMSExpenses:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: ExpenseCore
    settings:
      base:
        # Martin chose this bundle id (22 Oct 2026). It is the app's identity in
        # App Store Connect and TestFlight — never change it.
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.amsmanualexpenses
        # iPhone only, portrait. iPhone-only also keeps Apple's iPad orientation rule
        # (upload error 90474) out of the way.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: Expenses
        CFBundleName: AMS Manual Expenses
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: The microphone is used to dictate expenses.
        NSSpeechRecognitionUsageDescription: Your dictation is turned into text to log the expense.
        NSLocationWhenInUseUsageDescription: Your location is used to pick the local currency (for example SEK in Sweden, EUR in Spain).
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  AMSExpensesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AMSExpenses
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.amsmanualexpenses.uitests
        TEST_TARGET_NAME: AMSExpenses
schemes:
  AMSExpenses:
    build:
      targets:
        AMSExpenses: all
    test:
      targets:
        - AMSExpensesUITests
        # The parser's own tests run with the app's.
        - package: ExpenseCore/ExpenseCoreTests
