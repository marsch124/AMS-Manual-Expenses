name: AMSExpenses
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  ExpenseCore:
    path: ExpenseCore
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  AMSExpenses:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ExpenseCore
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Expenses
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: The microphone is used to dictate expenses.
        NSSpeechRecognitionUsageDescription: Your dictation is turned into text to log the expense.
        NSLocationWhenInUseUsageDescription: Your location is used to pick the local currency (for example SEK in Sweden, EUR in Austria).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.amsmanualexpenses
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
