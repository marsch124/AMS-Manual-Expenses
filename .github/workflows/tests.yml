# Martin's standing rule (16 Sep 2026): UI tests in CI on every push, every control found
# by its accessibilityIdentifier, never by its words. A red run blocks a release.
# The TestFlight workflow calls this one first.
name: Tests

on:
  push:
    paths-ignore:
      - .github/workflows/testflight.yml
      - .github/workflows/crash-reports.yml
      - docs/**
      - '**/*.md'
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  iphone:
    name: Parser tests + UI tests on the iPhone
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Parser tests
        run: cd Core && swift test

      - name: The release script's own check
        run: python3 tools/release-to-testers.py --self-check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # GitHub rotates its simulators: take the highest-numbered iPhone it really has
      # (never a hard-coded name; the last line of `simctl list` is often an iPhone SE).
      - name: Pick a simulator the runner actually has
        run: |
          PICK=$(xcodebuild -showdestinations -project AMSExpenses.xcodeproj -scheme AMSExpenses 2>/dev/null | python3 -c '
          import re, sys
          best = None
          for line in sys.stdin:
              m = re.search(r"platform:iOS Simulator,.*?id:([0-9A-F-]{36}), OS:([0-9.]+), name:iPhone (\d+)( Pro)? \}", line)
              if m:
                  key = (int(m.group(3)), [int(x) for x in m.group(2).split(".")], bool(m.group(4)))
                  if best is None or key > best[0]:
                      best = (key, m.group(1), "iPhone " + m.group(3) + (m.group(4) or "") + ", iOS " + m.group(2))
          if best: print(best[1], best[2])
          ')
          UDID=$(echo "$PICK" | cut -d" " -f1)
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator on this runner"
            xcodebuild -showdestinations -project AMSExpenses.xcodeproj -scheme AMSExpenses
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "Using simulator: $(echo "$PICK" | cut -d" " -f2-)"

      - name: Wake the simulator before the first test
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build the app and its tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AMSExpenses.xcodeproj \
            -scheme AMSExpenses \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build-for-testing.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build-for-testing.log

      # 22 Oct 2026, the first run: a cold GitHub simulator took so long to open the app
      # that BOTH tests failed at launch ("Timed out while launching application"), with
      # nothing wrong in the app. So the app is installed and opened once here, outside
      # the tests, and the suite starts on a warm simulator (AMS Packing has the same).
      - name: Open the app once before the tests
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/AMSExpenses.app
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" com.schabbauer.amsmanualexpenses -uiTesting || true
          sleep 20
          xcrun simctl terminate "$SIM_UDID" com.schabbauer.amsmanualexpenses || true

      - name: UI tests (and the parser's, inside the app's scheme)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AMSExpenses.xcodeproj \
            -scheme AMSExpenses \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults-iPhone.xcresult \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 480 \
            2>&1 | tee build-test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* TEST" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" build-test.log

      - name: Keep the results when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-iPhone
          path: |
            TestResults-iPhone.xcresult
            build-for-testing.log
            build-test.log
