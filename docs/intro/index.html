<meta charset="utf-8">
<title>Expenses Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Expenses Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Written for AMS Manual Expenses 1.30. Update this tour in the release that changes a taught screen. */
:root {
  --bg: #F4F6F7; --panel: #FFFFFF; --fg: #16232A; --muted: #5F7078; --line: #E2E8EA;
  --accent: #0F766E; --accent-soft: #D6EFEA; --good: #15803D; --good-soft: #E3F4E8; --warn: #C2410C;
  --shadow: 0 18px 40px rgba(22,35,42,.2);
  --pbg:#F4F6F7; --pcard:#FFFFFF; --pink:#16232A; --pmuted:#5F7078; --pline:#E2E8EA; --pfield:rgba(120,120,128,.14);
  --ind:#0F766E; --gt:#0F766E; --band:#0B2E2B; --bz:#FF8C1A; --bz-ink:#4A2300; --bzt:#C2410C;
  --plum:#9C3D8C; --plumt:#9C3D8C; --navy:#2A5194; --grn:#30D158; --grn-ink:#0B3A17; --sess:#15803D;
  --yel:#FFD60A; --yel-ink:#3D3000; --wut:#A16207; --gold:#B7791F; --acc:#2F6FE0; --red:#DC3D43; --blue:#0A84FF; --pink2:#FF6FA8; --pink2-ink:#5A0F2E;
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0E1416; --panel:#161F22; --fg:#E7EDEE; --muted:#94A6AC; --line:#26343A;
  --accent:#2DD4BF; --accent-soft:#123A36; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#0E1416; --pcard:#161F22; --pink:#E7EDEE; --pmuted:#94A6AC; --pline:#26343A; --pfield:rgba(120,120,128,.3);
  --gt:#2DD4BF; --bzt:#FDBA74; --plumt:#E29BD6; --sess:#86EFAC; --wut:#FCD34D; --gold:#F6C453;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#0E1416; --panel:#161F22; --fg:#E7EDEE; --muted:#94A6AC; --line:#26343A;
  --accent:#2DD4BF; --accent-soft:#123A36; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#0E1416; --pcard:#161F22; --pink:#E7EDEE; --pmuted:#94A6AC; --pline:#26343A; --pfield:rgba(120,120,128,.3);
  --gt:#2DD4BF; --bzt:#FDBA74; --plumt:#E29BD6; --sess:#86EFAC; --wut:#FCD34D; --gold:#F6C453;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: #0F766E; color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #0F766E; border-color: #0F766E; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pink); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
:where(.stage button) { font: inherit; color: inherit }
:where(.stage input) { font: inherit; color: var(--pink); -webkit-user-select: text; user-select: text }
.sbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; z-index: 40; pointer-events: none; background: linear-gradient(var(--pbg) 70%, transparent) }
.sbar .bat { width: 25px; height: 12px; border: 1.5px solid var(--pink); border-radius: 4px; position: relative; opacity: .8 }
.sbar .bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: var(--pink); border-radius: 2px }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 46px 16px 84px; scrollbar-width: none }
.scr::-webkit-scrollbar { display: none }
.sp { flex: 1 }
.tr { color: var(--gt) }

/* Tab bar: flat, three items, like the app */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--pcard); border-top: 1px solid var(--pline); display: flex; align-items: flex-start; padding-top: 6px; z-index: 30 }
.tabs button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--pmuted); cursor: pointer; padding: 0 }
.tabs button svg { width: 24px; height: 24px }
.tabs button.on { font-weight: 600 }

/* Navigation */
.ltop { display: flex; align-items: center; min-height: 40px }
.nbk { display: flex; align-items: center; border: 0; background: none; color: var(--acc); font-size: 16px; padding: 4px 0; cursor: pointer; min-height: 40px }
.nbk svg { width: 20px; height: 20px }
.ltitle { margin: 0 0 8px; font-size: 32px; line-height: 1.12; font-weight: 700 }
.inl { display: flex; align-items: center; min-height: 40px; margin-bottom: 4px }
.inl b { flex: 1; text-align: center; font-size: 17px }
.inl .l, .inl .r { width: 80px; display: flex }
.inl .r { justify-content: flex-end }
.ib { border: 0; background: none; padding: 6px; cursor: pointer; display: grid; place-items: center; color: var(--gt); border-radius: 10px }
.ib svg { width: 22px; height: 22px }
.cap { color: var(--pmuted); font-size: 12.5px; margin: 4px 0 }

/* ---------- Pretend screens of Expenses (every class starts with ex-) ---------- */
:root { --ex-amb:#F59E0B; --ex-ind:#4F46E5; --ex-red:#E5383B; --mapbg:#E3EAE0; --mapst:#FFFFFF; --mapw:#BFD9EA; --tint:rgba(15,118,110,.14) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mapbg:#1F2A26; --mapst:#33423C; --mapw:#1D3340; --tint:rgba(45,212,191,.2) } }
:root[data-theme="dark"] { --mapbg:#1F2A26; --mapst:#33423C; --mapw:#1D3340; --tint:rgba(45,212,191,.2) }
.stage { --acc:#0F766E; --gt:#0F766E; --pbg:#F2F2F7 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage { --acc:#2DD4BF; --gt:#2DD4BF; --pbg:#0E1416 } }
:root[data-theme="dark"] .stage { --acc:#2DD4BF; --gt:#2DD4BF; --pbg:#0E1416 }
.ex-top { display: flex; align-items: center; min-height: 38px; position: relative }
.ex-top b { position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; pointer-events: none }
.ex-top .sp { flex: 1 }
.ex-top .ib { padding: 5px }
.ex-g { background: var(--pcard); border-radius: 12px; margin: 0 0 8px; overflow: hidden }
.ex-hdr { display: flex; align-items: center; gap: 8px; padding: 6px 14px }
.ex-time { font: 700 32px/1 ui-rounded, "SF Pro Rounded", var(--f-phone); font-variant-numeric: tabular-nums }
.ex-date { font-size: 12.5px; color: var(--pmuted); display: flex; gap: 4px; align-items: center; white-space: nowrap }
.ex-date svg { width: 11px; height: 11px }
.ex-cur { margin-left: auto; border: 0; border-radius: 999px; padding: 6px 12px; background: color-mix(in srgb, var(--acc) 15%, transparent); color: var(--acc); font-weight: 700; font-size: 15px; cursor: pointer }
.ex-dict { display: flex; gap: 12px; align-items: center; padding: 8px 14px }
.ex-mic { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--acc); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none }
.ex-mic.on { background: var(--ex-red) }
.ex-mic svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
.ex-tf { flex: 1; min-width: 0 }
.ex-tfr { display: flex; gap: 6px; align-items: center }
.ex-in { flex: 1; min-width: 0; height: 34px; border: 0; border-radius: 8px; background: var(--pfield); padding: 0 10px; font-size: 15px }
.ex-go { border: 0; background: none; color: var(--acc); font-size: 16px; cursor: pointer }
.ex-go:disabled { color: var(--pmuted); opacity: .5; cursor: default }
.ex-stat { font-size: 12.5px; color: var(--pmuted); margin-top: 3px; min-height: 16px }
.ex-favs { display: flex; gap: 8px; padding: 0 14px 8px }
.ex-fav { border: 1px solid var(--pline); border-radius: 8px; padding: 3px 11px; font-size: 13px; background: var(--pfield); color: var(--acc); cursor: pointer }
.ex-sec { font-size: 12.5px; color: var(--pmuted); text-transform: uppercase; padding: 6px 14px 3px }
.ex-card { display: flex; align-items: center; padding: 6px 14px }
.ex-big { font: 700 34px/1.05 ui-rounded, "SF Pro Rounded", var(--f-phone); font-variant-numeric: tabular-nums }
.ex-sub { font-size: 14px; color: var(--pmuted) }
.ex-bars { display: flex; gap: 6px; align-items: flex-end; margin-left: auto }
.ex-bars div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--pmuted) }
.ex-bars i { display: block; width: 11px; border-radius: 3px; background: color-mix(in srgb, var(--acc) 38%, transparent) }
.ex-bars div.f i { background: var(--pline); height: 4px !important }
.ex-bars div.t span { font-weight: 700; color: var(--acc) }
.ex-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 14px; min-height: 40px; border: 0; border-top: 1px solid var(--pline); background: transparent; text-align: left; cursor: pointer; color: var(--pink) }
.ex-row.hi { background: var(--tint) }
.ex-row .m { flex: 1; min-width: 0 }
.ex-row .m b { display: block; font-weight: 500; font-size: 15px; line-height: 1.2 }
.ex-row .m small { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--pmuted) }
.ex-row .a { text-align: right; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums }
.ex-row .a small { display: block; font-weight: 400; font-size: 11.5px; color: var(--pmuted) }
.ex-ci { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none }
.ex-ci svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.ex-tag { font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 1px 6px; color: #fff }
.ex-thumb { width: 30px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #6EC6C0, #2F8F88); flex: none }
.ex-tiles { display: flex; gap: 8px; margin: 2px 0 8px }
.ex-tile { flex: 1; min-width: 0; text-align: left; border: 0; border-radius: 14px; padding: 7px 9px; background: var(--pcard); cursor: pointer; color: var(--pink) }
.ex-tile b { display: block; font-size: 12.5px; font-weight: 600 }
.ex-tile .v { display: block; font: 700 17px/1.2 ui-rounded, "SF Pro Rounded", var(--f-phone); white-space: nowrap }
.ex-tile .c { display: block; font-size: 11px; color: var(--pmuted); height: 16px; line-height: 16px }
.ex-tile.on { color: #fff }
.ex-tile.on .c { color: rgba(255,255,255,.85) }
.ex-mini { display: flex; gap: 3px; align-items: flex-end; height: 16px }
.ex-mini i { width: 6px; border-radius: 1.5px; display: block }
.ex-line { display: flex; align-items: center; gap: 6px; padding: 4px 14px; font-size: 13px; color: var(--pmuted) }
.ex-sw { width: 16px; height: 10px; border-radius: 3px; background: var(--tint); border: .5px solid color-mix(in srgb, var(--acc) 40%, transparent); display: inline-block }
.ex-over { color: #F97316 }
.ex-undo { position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 66; display: flex; align-items: center; gap: 10px; background: #292929; border-radius: 14px; padding: 8px 8px 8px 14px; color: #fff; font-weight: 600; font-size: 14.5px }
.ex-undo button { border: 0; border-radius: 16px; background: var(--acc); color: #fff; font-weight: 700; font-size: 14.5px; padding: 8px 16px; cursor: pointer; min-height: 36px }
.ex-saved { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); z-index: 70; background: color-mix(in srgb, var(--acc) 92%, #000); color: #fff; font-weight: 600; font-size: 13.5px; padding: 6px 14px; border-radius: 18px; display: flex; gap: 6px; align-items: center; animation: pop .3s }
.ex-saved svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
.ex-toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); background: #2F3B41; color: #fff; font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 18px; z-index: 90; animation: pop .3s; max-width: 340px; text-align: center }
.ex-menu { position: absolute; z-index: 80; right: 14px; top: 84px; background: var(--pcard); border: 1px solid var(--pline); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.3); min-width: 190px; overflow: hidden }
.ex-menu.l { right: auto; left: 14px; top: 46px }
.ex-menu button { display: flex; width: 100%; border: 0; background: none; text-align: left; padding: 11px 14px; font-size: 16px; cursor: pointer; justify-content: space-between; color: var(--pink) }
.ex-menu button + button { border-top: 1px solid var(--pline) }
.ex-menu button.on::after { content: "\2713"; color: var(--acc) }
.ex-sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 34px; border-radius: 22px 22px 0 0; background: var(--pbg); z-index: 55; overflow: hidden; box-shadow: 0 -8px 30px rgba(0,0,0,.3) }
.ex-nav { display: flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 0 12px; position: relative; z-index: 3; background: var(--pbg) }
.ex-nav b { position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; pointer-events: none }
.ex-nb { border: 0; background: none; color: var(--acc); font-size: 17px; cursor: pointer; padding: 8px 4px; display: flex; align-items: center; z-index: 1 }
.ex-nb.sv { font-weight: 700 }
.ex-nb:disabled { color: var(--pmuted); opacity: .5; cursor: default }
.ex-nb svg { width: 20px; height: 20px }
.ex-sheet .scr { inset: 46px 0 0 0; padding: 4px 16px 40px }
.ex-cap { font-size: 12.5px; color: var(--pmuted); text-transform: uppercase; padding: 8px 14px 3px }
.ex-heard { font-style: italic; color: var(--pmuted); display: block; padding: 6px 14px; font-size: 14px }
.ex-fld { display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 42px; border-top: 1px solid var(--pline); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: var(--pink); font-size: 16px }
.ex-fld:first-child { border-top: 0 }
button.ex-fld { cursor: pointer }
.ex-amt { font: 600 20px/1 var(--f-phone); font-variant-numeric: tabular-nums; flex: 1 }
.ex-amt.empty { color: var(--pmuted); font-weight: 400 }
.ex-curp { color: var(--pink); font-size: 16px }
.ex-lbl { background: var(--pfield); border-radius: 999px; padding: 3px 10px; font-size: 14.5px; font-variant-numeric: tabular-nums }
.ex-pill { font-weight: 600; font-size: 15px; border-radius: 999px; padding: 4px 12px; background: color-mix(in srgb, var(--acc) 15%, transparent); color: var(--acc) }
.ex-pill.g { background: var(--pfield); color: var(--pmuted); font-weight: 500 }
.ex-auto { margin-left: auto; font-size: 12.5px; color: var(--pmuted) }
.ex-chev { color: var(--pmuted); margin-left: auto; display: flex }
.ex-chev svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.ex-fix { height: 110px; border-radius: 10px; background: var(--mapbg); position: relative; overflow: hidden; width: 100% }
.ex-fix i { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #0F9C8F; border: 3px solid #fff }
.ex-mapcap { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--pmuted); margin-top: 5px }
.ex-mapcap svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
.ex-ph { display: flex; align-items: center; gap: 8px; padding: 10px 14px }
.ex-ph span { flex: 1; color: var(--pmuted); font-size: 15px }
.ex-cap2 { border: 0; border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 14px; display: flex; gap: 6px; align-items: center; cursor: pointer }
.ex-cap2 svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
.ex-cap2.full { background: var(--acc); color: #fff }
.ex-cap2.light { background: color-mix(in srgb, var(--acc) 15%, transparent); color: var(--acc) }
.ex-photo { height: 150px; margin: 0 14px 6px; border-radius: 12px; background: linear-gradient(135deg, #6EC6C0, #2F8F88) }
.ex-red { color: #E5383B; font-size: 16px }
.ex-seg { display: flex; background: var(--pfield); border-radius: 9px; padding: 2px; margin: 4px 0 8px }
.ex-seg button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 5px 0; font-size: 13px; cursor: pointer; color: var(--pink) }
.ex-seg button.on { background: var(--pcard); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15) }
.ex-map { position: relative; height: 190px; border-radius: 12px; overflow: hidden; background: var(--mapbg); margin-bottom: 6px }
.ex-map svg { position: absolute; inset: 0; width: 100%; height: 100% }
.ex-days { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 0 6px }
.ex-day { border: 0; border-radius: 999px; padding: 5px 13px; font-weight: 700; font-size: 13.5px; cursor: pointer }

/* The map */
function mapData() {
  const all = WEEK.filter(r => r.x != null), tod = all.filter(r => r.d === 4);
  const ordN = r => all.indexOf(r) + 1;
  let pins, routes = [], list;
  if (S.span === 'Today') { const fr = WEEK.filter(r => r.d === 4); pins = tod.map((r, i) => ({ r, n: i + 1, col: 'var(--acc)' })); routes = [{ pts: tod, col: '#0F9C8F', len: '1.9 km' }]; list = fr.map(r => ({ r, n: r.x != null ? tod.indexOf(r) + 1 : 0, col: 'var(--acc)' })); }
  else if (S.span === 'This week' || S.span === 'Last week') {
    const sel = S.day ? all.filter(r => DAYN[r.d] === S.day) : all;
    pins = sel.map(r => ({ r, n: ordN(r), col: DCOL[DAYN[r.d]] }));
    DAYN.forEach(dn => { const p = sel.filter(r => DAYN[r.d] === dn); if (p.length > 1) routes.push({ pts: p, col: DCOL[dn], len: ROUTE[dn] }); });
    list = WEEK.filter(r => !S.day || DAYN[r.d] === S.day).map(r => ({ r, n: r.x != null ? ordN(r) : 0, col: DCOL[DAYN[r.d]] }));
  } else { pins = all.map((r, i) => ({ r, n: i + 1, col: 'var(--acc)' })); list = WEEK.map(r => ({ r, n: r.x != null ? ordN(r) : 0, col: 'var(--acc)' })); }
  return { pins, routes, list };
}
function routeSVG(routes) {
  let out = '';
  routes.forEach(rt => {
    rt.pts.forEach((p, i) => {
      if (i === 0) return; const a = rt.pts[i - 1], dx = p.x - a.x, dy = p.y - a.y, side = i % 2 ? 1 : -1;
      const cx = (a.x + p.x) / 2 - dy * .15 * side, cy = (a.y + p.y) / 2 + dx * .15 * side;
      out += `<path d="M${a.x} ${a.y} Q${cx} ${cy} ${p.x} ${p.y}" fill="none" stroke="${rt.col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 8" opacity=".9"/>`;
      const mx = .25 * a.x + .5 * cx + .25 * p.x, my = .25 * a.y + .5 * cy + .25 * p.y, ang = Math.atan2(p.y - a.y, p.x - a.x) * 180 / Math.PI;
      out += `<g transform="translate(${mx} ${my}) rotate(${ang})" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-4 -4 L2 0 L-4 4" stroke="#fff" stroke-width="4.5"/><path d="M-4 -4 L2 0 L-4 4" stroke="${rt.col}" stroke-width="2.4"/></g>`;
    });
  });
  return out;
}

    { kind: 'look', head: 'Signs in this app (2)', text: 'And the signs of the map, the microphone, the Undo bar and the two kinds of teal button.', target: 'sign-2', setup: () => home({ page: 'signs', sig: 2 }) },
    { kind: 'check', head: 'Quick check', text: 'On the map one row has a grey "–" instead of a number. What does it mean?', answers: ['That expense has no position and is not on the map', 'That expense is from Monday', 'That expense was deleted'], right: 0, ok: 'Right. Location was off, or the expense is from before positions were kept.', setup: () => home({ page: 'map' }) },
  ]},
];

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('expenses-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (st.on && st.on[name]) { markTarget(st.on[name]); }
  if ((st.wait === name || st.alt === name) && (!st.when || st.when(data))) succeed(st.ok);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '\u2713 ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to tap is out of sight (a stray tap closed a page), point at the way back to it.
  const first = LESSONS[ci] && LESSONS[ci].steps[si] && LESSONS[ci].steps[si].target;
  const el = q(curTarget) || (first && first !== curTarget ? q(first) : null)
    || (S.sub ? q('sub-back') : S.sheet ? q('sheet-cancel') : S.page ? q('page-back') : null);
  if (el) {
    el.classList.add('target');
    const sc = el.closest('.scr');
    if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(), k = document.getElementById('stagebox').clientWidth / 390;
      if (r.top < s.top + 40 * k || r.bottom > s.bottom - 110 * k) sc.scrollTop += (r.top - s.top - 120 * k) / k; }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="logo">${icon('coin')}</span><div><h1>Expenses Tour</h1><small>Written for Expenses 1.30</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '\u2713' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('phone')}<span>Now on your iPhone</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Written for AMS Manual Expenses 1.30.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  const L = LESSONS[i]; if (L && L.setup) L.setup();
  renderStep();
}
function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  clearTimers(); clearTimeout(toastH);
  if (st.setup) st.setup();
  S.toast = '';
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">\u00B7 ${kindName} \u00B7 step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('expenses-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  clearTimers(); S = START(); curTarget = null; renderStage();
  const items = ["Open Expenses. Tap the big microphone and say \"Coffee 45 kronor\". Check the sheet that opens (description, amount, category, for whom, place) and tap Save. Look for \"Saved\" at the top.", "Type a sentence in the field under the microphone and tap Go, for example \"Lunch 129 kr\". Cancel it.", "Open an expense from Today and tap \"Same again, now\". Cancel. Swipe an expense to the left to delete it and tap Undo in the dark bar within 6 seconds.", "On the check sheet open the category, \"for whom\" and place pages. On the place page try \"Search places\" and \"Nearest first\".", "Tap the three small cards under Today: Yesterday, This week, Last week. Look for the weekly budget note and the tinted five highest.", "Tap the map button. Switch between Today, This week, Last week and Month, tap a day button, and read \"Route: about …\" under the map.", "Tap the chart button and open \"Search expenses\". Then open Settings and read How it works, Signs in this app."];
  let ticks = JSON.parse(store.get('expenses-real') || '[]');
  fin.innerHTML = `<h3>Now on your iPhone</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('expenses-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.menu) { S.menu = null; renderStage(); return; }
    if (S.sub) { act('sub-back'); return; }
    if (S.sheet) { act('sheet-cancel'); return; }
  }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
